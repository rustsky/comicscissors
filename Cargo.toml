[package]
name = "comic-scissors"
version = "0.2.0"
edition = "2024"
description = "Comic & manga panel splitter for e-readers: cuts out panels and repacks them so they are readable without zooming"
repository = "https://github.com/rustsky/comicscissors"
readme = "README.md"
keywords = ["comics", "manga", "kindle", "ereader", "panel-detection"]
categories = ["command-line-utilities", "multimedia::images"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff", "rayon"] }
indicatif = { version = "0.18.6", features = ["rayon"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "thin"
